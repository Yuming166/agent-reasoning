# Temporal Protocol — Group 0 (Data & Leakage Audit), Phase I
# Frozen on 2026-09-11. No Phase-I result is valid unless it references this file.
# Companion evidence: research/audit/DATA_AUDIT.md, research/audit/bq_metadata_2026-09-11.json
# All timestamps are UTC. All BigQuery objects live in project ictdata-507912, dataset exgraph.

version: 1.0
status: FROZEN
owner: Group 0 — Data & Leakage Audit
valid_from: 2026-09-11
project: ictdata-507912
dataset: exgraph
bigquery_location: US
query_policy:
  runner: research/audit/audit_query.py   # read-only wrapper; do not mutate tables
  partition_filter: REQUIRED             # every query on partitioned tables must predicate block_timestamp/snapshot_date/month
  maximum_bytes_billed: REQUIRED         # set an explicit cap per query; never export whole tables
  no_full_table_export: true

# ---------------------------------------------------------------------------
# 1. Data windows (all half-open [start, end))
# ---------------------------------------------------------------------------
windows:
  development_events: {start: "2022-03-01T00:00:00Z", end: "2022-09-01T00:00:00Z", inclusive: "start", label: DEV}
  holdout_events:     {start: "2022-09-01T00:00:00Z", end: "2022-10-01T00:00:00Z", inclusive: "start", label: FINAL_HOLDOUT}
  feature_lookback:   {duration_days: 90, end_relation: "strictly before cutoff t", label: LOOKBACK}
  label_horizon:      {duration_days: 30, start_relation: "at or after cutoff t", label: FORWARD}
  social_tweets_available: {start: "2021-02-01T00:00:00Z", end: "2023-06-12T23:59:59Z"}   # external context only
  eth_price_available: {start: "2017-08-16T16:45:00Z", end: "2026-09-10T02:24:00Z"}        # must be clipped as-of

# ---------------------------------------------------------------------------
# 2. Cutoffs (snapshot dates; all features must be computable strictly before t)
# ---------------------------------------------------------------------------
cutoffs:
  walk_forward: ["2022-05-01", "2022-06-01", "2022-07-01", "2022-08-01"]   # wallet_asof_features_v1
  frozen_split:
    train: "2022-06-01"
    validation: "2022-07-01"
    frozen_test: "2022-08-01"
  final_untouched_holdout: "2022-09-01"                                     # wallet_asof_features_20220901

cutoff_semantics:
  cutoff_t: "selection and feature computation may use ONLY information with timestamp strictly < t"
  label_window: "[t, t + 30d) for each cutoff t"
  label_source_primary_only: "labels are built from primary event families (external_tx, token_transfer); internal_trace is auxiliary"
  label_excludes: "counterparty_present=false rows and self_transactions are excluded from next-counterparty labels"

# ---------------------------------------------------------------------------
# 3. Feature availability rules (no-future-leakage contract)
# ---------------------------------------------------------------------------
feature_availability:
  event_features: "any *_90d feature at cutoff t uses only events in [t-90d, t) from the sequence tables/views"
  static_graph_prior_only: "ethereum_graph.gpickle / exgraph_structural_features_v1 (degree, PageRank) are full-window static priors; they may seed candidate pools or serve as baselines but MUST NOT be used as as-of prediction features at cutoff t"
  social_context: "influencer tweets are external market/asset context only (no author->wallet mapping exists); only tweets with created_at <= t may be used at cutoff t; never claim they are wallet-owner statements"
  price: "any price feature at cutoff t uses only rows with timestamp <= t (as-of join); the local minute price file extends to 2026-09-10 and MUST be clipped"
  candidate_pool: "candidate/negative pools must be built from events strictly before t (see nc_ranker_samples_v2 construction); prefer target pools defined over < t"
  forbidden_features:
    - future transactions (block_timestamp >= t)
    - future wallet labels / future network statistics
    - future prices or future social information
    - full-window static centrality as as-of prediction feature
    - same-snapshot future labels as a leak-free selector (P3 demo only)

# ---------------------------------------------------------------------------
# 4. No-leakage rules
# ---------------------------------------------------------------------------
no_leakage_rules:
  - "chronological split only: train < validation < frozen_test < final_holdout; never random splits"
  - "no circularity: historical data <= t -> estimate importance -> freeze top-K -> observe future -> evaluate"
  - "any feature at cutoff t must be recomputable from data strictly before t; post-hoc analyses must be labeled post-hoc"
  - "dev and holdout windows are disjoint: dev max partition 20220831 < holdout min partition 20220901 (verified)"
  - "sentinel handling: nc_ranker_samples_v2 g_rank=99999 marks positives outside historical global-popularity support; report supported-pool and full-vocabulary metrics SEPARATELY; never report naive full-pool MRR as performance"
  - "schema guard: dev sequence table stores trace_address as REPEATED INTEGER, holdout as STRING; any cross-window union MUST use the combined view target_event_sequences_20220301_20221001 or an explicit CAST"
  - "no tuning on the final holdout: frozen_test 2022-08-01 is the last tunable boundary; 2022-09-01 holdout is evaluated exactly once"

# ---------------------------------------------------------------------------
# 5. Evaluation protocol (frozen)
# ---------------------------------------------------------------------------
evaluation_protocol:
  procedure:
    - "1. For each cutoff t in walk_forward + final_holdout, build as-of features from [t-90d, t) primary events"
    - "2. Train on snapshot 2022-06-01, tune on 2022-07-01, freeze on 2022-08-01"
    - "3. Freeze the selected top-K sets at each cutoff using only information < t"
    - "4. Observe future window [t, t+30d) and compute metrics against next-counterparty / activity labels"
    - "5. Evaluate the final untouched holdout snapshot 2022-09-01 exactly once"
  budgets_k: [10, 25, 50, 100, 250, 500, 1000]
  metrics:
    - MRR
    - Recall@K
    - NDCG
    - coverage (event / hard-event / headroom)
    - support coverage (share of positives inside candidate support) and full-vocabulary variant
    - utility per selected wallet U(K)/K
  baselines:
    - random
    - volume / ETH flow / activity (size)
    - degree / weighted degree / PageRank / k-core (structural, static-prior baselines only)
    - behavioral (cluster/anomaly)
    - temporal (recent activity, acceleration, persistence)
    - predictive influence
    - information gain
  reporting_rules:
    - "always report support-restricted and broad/full-candidate boundaries separately"
    - "P1/P2/P3 are proxies, not causal influence; no causal claim without a valid identification strategy"
    - "selection-layer results (coverage/headroom) must not be presented as end-task prediction superiority"
    - "report cost axis as proxy units unless real LLM tokens/latency are measured"

